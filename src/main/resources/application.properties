spring.application.name=library

#spring.datasource.url=jdbc:mysql://localhost:3306/library
#spring.datasource.username=root
#spring.datasource.password=1234
server.port=8080
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.show-sql=true

# B?t tính n?ng l?u d? li?u vào file thay vì m?t s?ch khi t?t app (Khuyên dùng)
spring.datasource.url=jdbc:h2:file:~/testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# B?t giao di?n qu?n lý H2 Console trên trình duy?t
spring.h2.console.enabled=true

# ???ng d?n ?? truy c?p vào H2 Console (M?c ??nh là /h2-console)
spring.h2.console.path=/h2-console

# Cho phép truy c?p giao di?n H2 khi ch?y app qua các khung nhìn nh? th? iframe
spring.h2.console.settings.web-allow-others=false

# C?u hình Hibernate t? ??ng t?o/c?p nh?t b?ng d?a trên Entity Java
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
